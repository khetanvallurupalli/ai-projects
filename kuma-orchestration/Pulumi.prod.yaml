config:
  # ============================================================================
  # Environment
  # ============================================================================
  kuma-orchestration:environment: prod

  # ============================================================================
  # Multi-Cluster Configuration
  # ============================================================================
  cluster:currentCluster: eks-prod
  cluster:clusters:
    # Primary EKS cluster (hosts Global CP) - US West
    - name: eks-prod
      type: eks
      zoneName: eks-us-west-2
      region: us-west-2
      infraStackName: organization/infra/prod
      isGlobalCpCluster: true
      zoneIngressEnabled: true
      zoneEgressEnabled: true
      podCidr: "10.0.0.0/16"
      serviceCidr: "172.20.0.0/16"

    # Secondary EKS cluster - US East (DR)
    - name: eks-prod-east
      type: eks
      zoneName: eks-us-east-1
      region: us-east-1
      infraStackName: organization/infra-east/prod
      isGlobalCpCluster: false
      zoneIngressEnabled: true
      zoneEgressEnabled: true
      podCidr: "10.1.0.0/16"
      serviceCidr: "172.21.0.0/16"

    # Azure AKS cluster - Europe
    - name: aks-prod-eu
      type: aks
      zoneName: aks-westeurope
      region: westeurope
      infraStackName: organization/aks-infra/prod
      isGlobalCpCluster: false
      zoneIngressEnabled: true
      zoneEgressEnabled: true
      podCidr: "10.244.0.0/16"
      serviceCidr: "10.0.0.0/16"

    # On-premises AKS Local cluster
    - name: aks-local-prod
      type: aks-local
      zoneName: aks-onprem-dc1
      region: onprem-dc1
      kubeconfigSecretName: aks-local-prod-kubeconfig
      isGlobalCpCluster: false
      zoneIngressEnabled: true
      zoneEgressEnabled: true
      cloudProviderSettings:
        apiServerEndpoint: "https://aks-local-prod.internal:6443"
        internalLoadBalancer: "true"
        zoneIngressAddress: "10.50.0.100"

  # ============================================================================
  # Cross-Cluster Settings (Production - Strict)
  # ============================================================================
  crossCluster:enabled: true
  crossCluster:mtlsMode: strict
  crossCluster:caBackend: builtin
  crossCluster:certValidityDays: 365
  crossCluster:certRotationThreshold: 80
  crossCluster:universalServiceDiscovery: true
  crossCluster:localityAwareLb: true
  crossCluster:localityPriorityWeight: 100
  crossCluster:crossZoneTrafficEnabled: true
  crossCluster:crossZoneTrafficDefault: Deny
  crossCluster:passthroughMode: none

  # ============================================================================
  # Kuma Core Settings
  # ============================================================================
  kuma:version: "2.6.0"
  kuma:mode: standalone
  kuma:namespace: kuma-system
  kuma:meshName: default
  kuma:mtlsEnabled: true
  kuma:mtlsBackend: builtin

  # Global Control Plane Settings (HA in production)
  kuma:globalCp:
    enabled: true
    replicas: 3
    kdsPort: 5685
    kdsTlsEnabled: true
    zoneSyncServiceType: LoadBalancer
    externalAddress: kuma-global.example.com
    externalPort: 5685

  # ============================================================================
  # Timeouts (stricter in prod)
  # ============================================================================
  kuma:httpRequestTimeout: 15
  kuma:httpIdleTimeout: 60
  kuma:tcpIdleTimeout: 3600

  # ============================================================================
  # Retry settings
  # ============================================================================
  kuma:retryAttempts: 3
  kuma:retryPerTryTimeout: 5
  kuma:retryBackoffBase: 25
  kuma:retryBackoffMax: 250

  # ============================================================================
  # Rate limiting (higher limits in prod)
  # ============================================================================
  kuma:rateLimitRps: 1000
  kuma:rateLimitBurst: 2000

  # ============================================================================
  # Circuit breaker (higher limits in prod)
  # ============================================================================
  kuma:circuitBreakerMaxConnections: 4096
  kuma:circuitBreakerMaxPending: 4096
  kuma:circuitBreakerMaxRequests: 4096
  kuma:circuitBreakerMaxRetries: 3
  kuma:outlierConsecutiveErrors: 5
  kuma:outlierInterval: 10
  kuma:outlierBaseEjectionTime: 30
  kuma:outlierMaxEjectionPercent: 50

  # ============================================================================
  # Observability (lower sample rate in prod)
  # ============================================================================
  kuma:prometheusPort: 5670
  kuma:tracingBackend: datadog
  kuma:traceSampleRate: "0.01"
  kuma:loggingFormat: json
  kuma:datadogAgentAddress: datadog-agent.datadog.svc.cluster.local:8126

  # ============================================================================
  # Fault injection (disabled in prod)
  # ============================================================================
  kuma:faultInjectionEnabled: false

  # ============================================================================
  # Traffic permissions (restrictive in prod)
  # ============================================================================
  kuma:trafficPermissionDefault: Deny

  # ============================================================================
  # Managed services
  # ============================================================================
  kuma:managedServices:
    - frontend
    - backend
    - api-gateway
    - payment-service
    - notification-service
    - user-service
    - order-service

  # ============================================================================
  # Cross-cluster namespace access (accessible from other clusters)
  # Each entry specifies a namespace. If 'services' is provided, only those
  # services are accessible cross-cluster. If omitted, all services in the
  # namespace are accessible.
  # ============================================================================
  kuma:crossClusterNamespaces:
    # Only specific services in the backend namespace
    - namespace: backend-ns
      services:
        - backend
        - api-gateway
    # Only specific services in the user/order namespace
    - namespace: platform-ns
      services:
        - user-service
        - order-service
    # All services in shared-services namespace are accessible
    - namespace: shared-services
